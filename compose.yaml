services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  web-prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    profiles: ["prod"]

volumes:
  node_modules:
